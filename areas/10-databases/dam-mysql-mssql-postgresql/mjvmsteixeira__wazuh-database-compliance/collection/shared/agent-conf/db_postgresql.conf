<!--
  Agent Configuration — Grupo db_postgresql
  Wazuh 4.14.5 | Database Activity Monitoring

  Aplicado automaticamente a agentes no grupo db_postgresql.
  Colocar em: /var/ossec/etc/shared/db_postgresql/agent.conf (no Manager)

  Pré-requisitos no agente:
    - postgresql.conf: log_destination='syslog'  ← OBRIGATÓRIO
        (com 'stderr' as linhas não têm header syslog, o predecoder Wazuh
        não extrai program_name=postgres, e o nosso decoder com parent
        program_name não casa. Resultado: rule built-in 2501 dispara em vez
        da nossa 100211.)
    - postgresql.conf: syslog_facility='LOCAL0', syslog_ident='postgres'
    - pgaudit instalado e configurado (pgaudit.log='all')
    - rsyslog: facility LOCAL0 → /var/log/postgresql/postgresql.log
    - Permissões de leitura para o utilizador ossec

  Referências regulatórias:
    - PCI-DSS 10.2: Registar eventos auditáveis
    - RGPD Art. 30: Registos das atividades de tratamento
-->

<agent_config>

  <!-- Labels para identificação nos dashboards e regras -->
  <labels>
    <label key="database_type">postgresql</label>
  </labels>

  <!-- Recolha dos logs do PostgreSQL (pgaudit)
       O caminho assume rsyslog a encaminhar LOCAL0 para este ficheiro;
       se o ambiente usar logging_collector=on do PostgreSQL ajustar para
       /var/lib/postgresql/<ver>/main/pg_log/*.log (mas garantir que as
       linhas têm prefixo syslog — ver pré-requisito log_destination=syslog). -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/postgresql/postgresql.log</location>
  </localfile>

  <!-- Monitorização de integridade das configurações PostgreSQL -->
  <syscheck>
    <directories realtime="yes" report_changes="yes">/etc/postgresql</directories>
  </syscheck>

</agent_config>
