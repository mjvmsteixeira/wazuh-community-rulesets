<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wazuh Community Rulesets</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect width='16' height='16' fill='%230A0F1E'/><path fill='%233585F9' d='M2 3h2v8h1V7h2v4h1V7h2v4h1V3h2v10h-3v-1h-2v1H7v-1H5v1H2z'/><rect x='12' y='13' width='2' height='1' fill='%23FEDD0B'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;700&family=Press+Start+2P&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #3585F9; --blue-2: #499CFE; --yellow: #FEDD0B; --ok: #36D399; --bad: #FF6B6B; --warn: #FFB547;
  --bg: #0A0F1E; --bg-2: #0F1629; --panel: #131C33; --panel-2: #18233F; --line: #2A3A63; --text: #E6EDF7; --muted: #8FA3BF;
  --shadow: #000; --code-bg: #070B16; --glow: 0 0 8px rgba(53,133,249,.55);
  --pixel: 'Press Start 2P', 'Fira Mono', monospace; --mono: 'Fira Mono', ui-monospace, Menlo, monospace; --sans: 'Manrope', system-ui, sans-serif;
}
:root[data-theme="light"] {
  --bg: #F6F6F6; --bg-2: #FFFFFF; --panel: #FFFFFF; --panel-2: #F0F4FB; --line: #B7C6D7; --text: #292929; --muted: #5B6B80;
  --shadow: #2B2D34; --code-bg: #F7F8FA; --glow: none;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #F6F6F6; --bg-2: #FFFFFF; --panel: #FFFFFF; --panel-2: #F0F4FB; --line: #B7C6D7; --text: #292929; --muted: #5B6B80;
  --shadow: #2B2D34; --code-bg: #F7F8FA; --glow: none;
} }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text); font: 14px/1.5 var(--mono);
  background-image: linear-gradient(var(--bg-2) 1px, transparent 1px), linear-gradient(90deg, var(--bg-2) 1px, transparent 1px);
  background-size: 24px 24px; min-height: 100vh;
}
.crt { position: fixed; inset: 0; pointer-events: none; z-index: 100;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,.10) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
:root[data-theme="light"] .crt { opacity: .35; }
a { color: var(--blue-2); }
a:hover { color: var(--yellow); }
header { border-bottom: 3px solid var(--blue); background: var(--bg-2); position: sticky; top: 0; z-index: 20; }
.bar { max-width: 1400px; margin: 0 auto; padding: 14px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.logo { font: 16px/1.2 var(--pixel); color: var(--blue); text-shadow: var(--glow); letter-spacing: 1px; white-space: nowrap; }
.logo b { color: var(--yellow); }
.logo small { display: block; font: 9px var(--pixel); color: var(--muted); margin-top: 6px; letter-spacing: 0; }
.search { flex: 1 1 320px; display: flex; align-items: center; gap: 8px; border: 2px solid var(--line); background: var(--panel); padding: 6px 10px; box-shadow: 4px 4px 0 var(--shadow); }
.search:focus-within { border-color: var(--blue); }
.search span { color: var(--yellow); font-weight: 700; }
.search input { flex: 1; background: transparent; border: 0; color: var(--text); font: 15px var(--mono); outline: none; min-width: 0; }
.search kbd { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--line); padding: 1px 5px; }
.btn { font: 10px var(--pixel); color: var(--text); background: var(--panel-2); border: 2px solid var(--line);
  padding: 9px 12px; cursor: pointer; box-shadow: 3px 3px 0 var(--shadow); white-space: nowrap; }
.btn:hover { border-color: var(--blue); color: var(--blue-2); }
.btn:active { transform: translate(3px,3px); box-shadow: none; }
.btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn.primary:hover { background: var(--blue-2); color: #fff; }
.btn.yellow { background: var(--yellow); color: #292929; border-color: var(--yellow); }
.btn.small { font-size: 8px; padding: 6px 8px; box-shadow: 2px 2px 0 var(--shadow); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
nav { max-width: 1400px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; }
nav button { font: 10px var(--pixel); color: var(--muted); background: none; border: 0; border-bottom: 4px solid transparent; padding: 12px 12px 10px; cursor: pointer; white-space: nowrap; }
nav button:hover { color: var(--text); }
nav button.on { color: var(--yellow); border-bottom-color: var(--yellow); }
nav button .n { color: var(--blue-2); margin-left: 6px; }
main { max-width: 1400px; margin: 0 auto; padding: 18px 16px 60px; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
select { font: 13px var(--mono); color: var(--text); background: var(--panel); border: 2px solid var(--line); padding: 6px 8px; max-width: 100%; }
.count { color: var(--muted); margin-left: auto; font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 2px solid var(--line); box-shadow: 5px 5px 0 var(--shadow); padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card:hover { border-color: var(--blue); transform: translate(-1px,-1px); box-shadow: 6px 6px 0 var(--blue); }
.card h3 { margin: 0; font: 800 15px/1.3 var(--sans); overflow-wrap: anywhere; }
.card .src { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.area { font: 8px var(--pixel); color: var(--blue-2); text-transform: uppercase; }
.nums { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.nums b { color: var(--text); font-size: 15px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.b { font: 11px var(--mono); padding: 1px 6px; border: 1px solid currentColor; white-space: nowrap; }
.b.ok { color: var(--ok); } .b.bad { color: var(--bad); } .b.warn { color: var(--warn); } .b.info { color: var(--blue-2); } .b.mut { color: var(--muted); }
.b.fill-bad { background: var(--bad); color: #1a0000; border-color: var(--bad); }
.more { text-align: center; margin: 20px 0; }
table { width: 100%; border-collapse: collapse; background: var(--panel); border: 2px solid var(--line); box-shadow: 5px 5px 0 var(--shadow); }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13px; }
th { font: 700 11px var(--mono); letter-spacing: .5px; text-transform: uppercase; color: var(--yellow); background: var(--panel-2); position: sticky; top: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel-2); }
td.num, th.num { text-align: right; }
.tablewrap { overflow-x: auto; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; margin-bottom: 22px; }
.kpi { background: var(--panel); border: 2px solid var(--line); box-shadow: 5px 5px 0 var(--shadow); padding: 14px; }
.kpi .v { font: 22px var(--pixel); color: var(--yellow); text-shadow: var(--glow); margin: 6px 0; }
.kpi .l { font-size: 12px; color: var(--muted); }
.kpi.bad .v { color: var(--bad); } .kpi.ok .v { color: var(--ok); }
h2 { font: 12px var(--pixel); color: var(--blue); text-shadow: var(--glow); margin: 28px 0 12px; }
h2:first-child { margin-top: 0; }
p.lead { color: var(--muted); max-width: 900px; margin: 0 0 16px; font-family: var(--sans); font-size: 15px; }
.meter { display: flex; height: 12px; border: 1px solid var(--line); background: var(--bg); min-width: 90px; }
.meter i { display: block; height: 100%; }
.meter .g { background: var(--ok); } .meter .y { background: var(--warn); } .meter .r { background: var(--bad); }
.pct { font-size: 12px; color: var(--muted); }
/* painel lateral */
.overlay { position: fixed; inset: 0; background: rgba(5,8,18,.7); z-index: 40; display: none; }
.overlay.on { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(980px, 100%); background: var(--bg-2); border-left: 3px solid var(--blue); z-index: 50;
  transform: translateX(100%); transition: transform .15s steps(4); display: flex; flex-direction: column; }
.drawer.on { transform: none; }
.dhead { padding: 16px; border-bottom: 2px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
.dhead h2 { margin: 0 0 6px; font: 800 20px/1.25 var(--sans); color: var(--text); text-shadow: none; text-transform: none; overflow-wrap: anywhere; }
.dhead .x { margin-left: auto; }
.dtabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 2px solid var(--line); overflow-x: auto; }
.dbody { padding: 16px; overflow-y: auto; flex: 1; }
.kv { display: grid; grid-template-columns: 170px 1fr; gap: 6px 14px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.alert { border: 2px solid var(--bad); background: rgba(255,107,107,.08); padding: 10px 12px; margin: 0 0 14px; font-size: 13px; }
.alert.warn { border-color: var(--warn); background: rgba(255,181,71,.08); }
.alert.info { border-color: var(--blue); background: rgba(53,133,249,.08); }
.alert b { font: 700 12px var(--mono); display: block; margin-bottom: 4px; letter-spacing: .5px; text-transform: uppercase; }
.files { display: grid; grid-template-columns: 260px 1fr; gap: 14px; min-height: 400px; }
.flist { border: 2px solid var(--line); background: var(--panel); max-height: 70vh; overflow: auto; }
.flist button { display: block; width: 100%; text-align: left; font: 12px var(--mono); color: var(--text); background: none; border: 0; border-bottom: 1px solid var(--line); padding: 7px 9px; cursor: pointer; overflow-wrap: anywhere; }
.flist button:hover, .flist button.on { background: var(--panel-2); color: var(--yellow); }
.flist .k { font: 700 10px var(--mono); color: var(--blue-2); text-transform: uppercase; display: block; margin-bottom: 3px; }
.code { position: relative; min-width: 0; }
pre { margin: 0; background: var(--code-bg); border: 2px solid var(--line); padding: 14px; overflow: auto; max-height: 70vh; font: 12.5px/1.5 var(--mono); white-space: pre; }
.code .copy { position: absolute; top: 8px; right: 8px; }
.tok-tag { color: var(--blue-2); } .tok-attr { color: var(--yellow); } .tok-str { color: var(--ok); } .tok-com { color: var(--muted); font-style: italic; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--yellow); color: #292929; font: 10px var(--pixel);
  padding: 12px 16px; box-shadow: 4px 4px 0 var(--shadow); z-index: 90; display: none; }
.toast.on { display: block; }
.loading { text-align: center; padding: 120px 20px; font: 12px var(--pixel); color: var(--blue); }
.blink { animation: blink 1s steps(2) infinite; } @keyframes blink { 50% { opacity: 0; } }
.empty { color: var(--muted); padding: 30px; text-align: center; border: 2px dashed var(--line); }
.cart-n { background: var(--yellow); color: #292929; padding: 0 5px; margin-left: 6px; }
footer { max-width: 1400px; margin: 0 auto; padding: 20px 16px 40px; color: var(--muted); font-size: 12px; border-top: 2px solid var(--line); }
.sig { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
.avatar { width: 44px; height: 44px; display: grid; place-items: center; font: 18px var(--pixel); color: #292929; background: var(--yellow);
  box-shadow: 4px 4px 0 var(--blue); image-rendering: pixelated; }
.who { font: 11px var(--pixel); color: var(--text); line-height: 1.6; }
.who a { color: var(--yellow); text-decoration: none; } .who a:hover { text-decoration: underline; }
.amb { font: 700 13px var(--mono); color: var(--blue-2); margin-top: 4px; }
.amb .star { color: var(--yellow); }
.press { margin-left: auto; font: 9px var(--pixel); color: var(--blue); text-shadow: var(--glow); background: none; border: 0; padding: 8px; cursor: pointer; }
.press:hover, .press:focus-visible { color: var(--yellow); outline: 2px dashed var(--yellow); outline-offset: 2px; }
a.btn { text-decoration: none; display: inline-block; }
.cta { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; border: 2px dashed var(--yellow); padding: 12px 14px; margin: 0 0 20px; }
.jump { font-size: 13px; margin: 0 0 16px; color: var(--muted); }
.jump a { color: var(--blue-2); }
a.kpi { display: block; color: inherit; text-decoration: none; cursor: pointer; } a.kpi:hover, a.kpi:focus-visible { border-color: var(--yellow); transform: translate(-1px,-1px); box-shadow: 6px 6px 0 var(--yellow); }
.kpi.active { border-color: var(--yellow); box-shadow: 6px 6px 0 var(--yellow); }
.kpi .go { font: 8px var(--pixel); color: var(--blue-2); margin-top: 6px; }
.cta p { margin: 0; flex: 1 1 320px; font-family: var(--sans); font-size: 14px; }
footer p { margin: 0; line-height: 1.8; }
@media (max-width: 760px) {
  .files { grid-template-columns: 1fr; } .flist { max-height: 30vh; } .kv { grid-template-columns: 1fr; } .kv dt { margin-top: 6px; }
  .logo { font-size: 13px; } .grid { grid-template-columns: 1fr; } th, td { padding: 6px; }
  .hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } .blink { animation: none; } }
</style>
</head>
<body>
<div class="crt" aria-hidden="true"></div>
<header>
  <div class="bar">
    <div class="logo">WAZUH<b>//</b>RULESETS<small id="sub"></small></div>
    <label class="search"><span>&gt;</span><input id="q" type="search" autocomplete="off"><kbd>/</kbd></label>
    <a class="btn" id="lang" href="__LANG_HREF__" hreflang="__LANG_OTHER__">__LANG_LABEL__</a>
    <button class="btn" id="theme"></button>
    <button class="btn yellow" id="cartBtn"><span id="cartL"></span><span class="cart-n" id="cartN">0</span></button>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="main"><div class="loading" id="loading">LOADING DATA<span class="blink">_</span></div></main>
<footer>
  <div class="sig">
    <div class="avatar" aria-hidden="true">M</div>
    <div>
      <div class="who"><span id="curated"></span> <a href="https://github.com/mjvmsteixeira" target="_blank" rel="noopener">@mjvmst</a></div>
      <div class="amb"><span class="star" aria-hidden="true">&#9733;</span> <a href="https://wazuh.com/ambassadors/marco-teixeira/" target="_blank" rel="noopener">Wazuh Ambassador</a> · Portugal</div>
    </div>
    <button class="press" id="press" type="button">PRESS <span class="blink">&#9608;</span> TO CONTINUE</button>
  </div>
  <p id="foot"></p>
</footer>
<div class="overlay" id="ov"></div>
<aside class="drawer" id="dr" aria-hidden="true"></aside>
<div class="toast" id="toast"></div>
<script id="meta" type="application/octet-stream">__META__</script>
<script id="blob" type="application/octet-stream">__FILES__</script>
<script>
'use strict';
const LANG = '__LANG__';
const REPO = 'https://github.com/mjvmsteixeira/wazuh-community-rulesets';
// ---------- i18n: English is the source; PT holds the Portuguese version of every visible string
const PT = {
  'correlation': 'correlação', 'time of day': 'horário', 'first time seen': 'primeira vez', 'e.g.': 'p.ex.', '{n} rules': '{n} regras',
  'Rules that lose events to official siblings in some situations': 'Regras que perdem eventos para irmãs oficiais em certas situações',
  'An official sibling of the same parent is evaluated first and has conditions that depend on context, not on the event: repeated events (correlation), the time of day, or a first occurrence. When they hold, the official rule takes the event and this rule does not alert. wazuh-analysisd -t does not warn about it.': 'Uma irmã oficial do mesmo pai é avaliada primeiro e tem condições que dependem do contexto, não do evento: eventos repetidos (correlação), a hora do dia ou uma primeira ocorrência. Quando se cumprem, a regra oficial fica com o evento e esta não alerta. O wazuh-analysisd -t não avisa.',
  'Tested together: {n} of the chosen pairs': 'Testados juntos: {n} dos pares escolhidos',
  'tools/combo_test.py loaded these pairs together in wazuh-logtest and replayed their log samples.': 'O tools/combo_test.py carregou estes pares juntos no wazuh-logtest e repetiu as amostras de log.',
  '{s} of {n} samples changed owner (decoder {d}, sibling rule {r}, ID conflict {i}, lost alert {l})': '{s} de {n} amostras mudaram de dono (decoder {d}, regra irmã {r}, conflito de ID {i}, alerta perdido {l})',
  '{n} samples, none changed': '{n} amostras, nenhuma mudou',
  'These packs add a child rule with no conditions of its own that is evaluated before official siblings of the same parent (level 0, or a higher level): it takes those events and the official detections stop alerting. wazuh-analysisd -t does not warn about it.': 'Estes packs acrescentam uma regra filha sem condições próprias que é avaliada antes de irmãs oficiais do mesmo pai (nível 0, ou nível acima): fica com esses eventos e as deteções oficiais deixam de alertar. O wazuh-analysisd -t não avisa.',
  '(latent: the pack does not load today)': '(latente: o pack hoje não carrega)',
  'COMMUNITY · 4.x': 'COMUNIDADE · 4.x', 'search packs, rules, decoders, techniques, playbooks…': 'pesquisar packs, regras, decoders, técnicas, playbooks…',
  'Search': 'Pesquisar', 'Theme': 'Tema', 'Toggle theme': 'Alternar tema', 'Install': 'Instalar', 'LOADING DATA': 'A CARREGAR DADOS',
  'Curated by': 'Curado por', 'Back to the top and search': 'Voltar ao topo e pesquisar',
  'Independent community registry, maintained by a Wazuh Ambassador; not an official Wazuh, Inc. product.': 'Registo comunitário independente, mantido por um embaixador da Wazuh; não é um produto oficial da Wazuh, Inc.',
  'Original source files, unchanged, each with its origin and pinned commit; respect each source\'s license (NONE = no license: internal use only).': 'Ficheiros originais das fontes, sem alterações, cada um com a origem e o commit fixado; respeitar a licença de cada fonte (NONE = sem licença: só uso interno).',
  'Validated with <code>wazuh-analysisd -t</code>, <code>verify-agent-conf</code> and <code>wazuh-logtest</code> on the reference wazuh-manager.': 'Validado com <code>wazuh-analysisd -t</code>, <code>verify-agent-conf</code> e <code>wazuh-logtest</code> no wazuh-manager de referência.',
  'Questions, errors or suggestions: <a href="{issues}" target="_blank" rel="noopener">open an issue</a>. Author of a source and want it removed? Open an issue and it will be taken down.': 'Dúvidas, erros ou sugestões: <a href="{issues}" target="_blank" rel="noopener">abrir uma issue</a>. É autor de uma fonte e quer que seja retirada? Abra uma issue e é removida.',
  'Coverage': 'Cobertura',
  'Measured on wazuh-analysisd 4.14.8: level-0 sibling rules are evaluated first, then the others by level (highest first); on equal level, by load order (file name, across official and installed files); the first one that matches takes the event. A child rule with no conditions of its own always matches, so it silences every sibling evaluated after it.': 'Medido no wazuh-analysisd 4.14.8: as regras irmãs de nível 0 são avaliadas primeiro, depois as outras por nível (o mais alto primeiro); em empate, pela ordem de carregamento (nome do ficheiro, entre oficiais e instalados); a primeira que corresponder fica com o evento. Uma regra filha sem condições próprias corresponde sempre, por isso silencia todas as irmãs avaliadas depois dela.',
  '{a} rule {r} (catch-all, level {l}) silences {b}: {lost}': '{a}: a regra {r} (apanha-tudo, nível {l}) silencia {b}: {lost}',
  'Each pack validates on its own, but installed together the sibling evaluated first (level 0, then the highest level, then the first loaded) takes the events both match, and the other does not alert. Overlap is only possible, not certain: confirm with <code>tools/combo_test.py</code> (replays each pack\'s log samples with the packs loaded together). Shown as rule@level.': 'Cada pack valida sozinho, mas instalados juntos o irmão avaliado primeiro (nível 0, depois o nível mais alto, depois o primeiro carregado) fica com os eventos que ambos apanham, e o outro não alerta. A sobreposição é possível, não certa: confirmar com <code>tools/combo_test.py</code> (repete as amostras de cada pack com os packs carregados juntos). Mostrado como regra@nível.',
  'Packs that silence official Wazuh rules, even installed alone': 'Packs que silenciam regras oficiais da Wazuh, mesmo instalados sozinhos',
  'These packs add a child rule with no conditions of its own and a higher level than official siblings of the same parent: it takes those events and the official detections stop alerting. The pack loads and validates normally.': 'Estes packs acrescentam uma regra filha sem condições próprias e com nível acima de irmãs oficiais do mesmo pai: fica com esses eventos e as deteções oficiais deixam de alertar. O pack carrega e valida normalmente.',
  'rule {r} (level {l}, {p}) silences {n} official rules, e.g. {ex}': 'a regra {r} (nível {l}, {p}) silencia {n} regras oficiais, p.ex. {ex}', 'official parent': 'pai oficial',
  '{n} parent rules where a pack will silence another': '{n} regras-pai em que um pack vai silenciar outro',
  'A child rule with no conditions of its own takes every event of the parent; the sibling rules of the packs loaded after it never alert. Load order follows the installed file names (alphabetical).': 'Uma regra filha sem condições próprias apanha todos os eventos do pai; as regras irmãs dos packs carregados depois dela nunca alertam. A ordem de carregamento segue os nomes dos ficheiros instalados (alfabética).',
  '{a} (catch-all) silences {b}': '{a} (apanha-tudo) silencia {b}',
  '{n} ambiguous parents': '{n} pais ambíguos',

function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1800); }
async function copy(text, what) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast(_('{what} copied', {what: what || _('Text')}));
}
function download(name, text) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: 'text/plain'})); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function hl(src) {   // realce simples de XML
  return esc(src).replace(/(&lt;!--[\s\S]*?--&gt;)|(&lt;\/?)([\w:.-]+)((?:\s+[\w:.-]+=(?:&quot;.*?&quot;|&#39;.*?&#39;))*)\s*(\/?&gt;)/g,
    (m, com, open, tag, attrs, close) => com ? `<span class="tok-com">${com}</span>` :
      `${open}<span class="tok-tag">${tag}</span>${attrs.replace(/([\w:.-]+)=(&quot;.*?&quot;|&#39;.*?&#39;)/g, '<span class="tok-attr">$1</span>=<span class="tok-str">$2</span>')}${close}`);
}
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const words = () => norm(state.q).split(/\s+/).filter(Boolean);
const match = (hay, ws) => { const h = norm(hay); return ws.every(w => h.includes(w)); };
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const areaName = a => a.replace(/^\d+-/, '').replace(/-/g, ' ');
const areaDesc = a => (LANG === 'en' ? D.areas_en : D.areas)[a] || '';

// ---------- estado de cada pack
function packStatus(p) {
  if (!p.ok) return ['bad', _('DOES NOT LOAD')];
  if (p.w) return ['warn', _(p.w > 1 ? 'LOADS · {n} WARNINGS' : 'LOADS · {n} WARNING', {n: p.w})];
  return ['ok', _('LOADS')];
}
function testBadge(p) {
  const t = p.tests; if (!t || !t.samples || t.not_tested === t.samples) return '';
  return t.failed ? `<span class="b warn" title="${esc(_('{a} shadowed, {b} not decoded, {c} rule missing, {d} false positives', {a: t.sombreado, b: t['não descodificado'], c: t['regra não disparou'], d: t['falso positivo']}))}">${_('TESTS {ok}/{n}', {ok: t.ok, n: t.samples - t.not_tested})}</span>`
                  : `<span class="b ok">${_('TESTS {ok}/{n}', {ok: t.ok, n: t.samples})}</span>`;
}
function licBadge(l) { return l === 'NONE' ? `<span class="b bad">${_('NO LICENSE')}</span>` : `<span class="b mut" title="${esc(V(l))}">${esc(l.startsWith('MIT?') ? _('MIT? (no file)') : l)}</span>`; }
const saBadge = p => p.sa ? `<span class="b ok">${_('STANDALONE')}</span>` : `<span class="b warn">${_('DEPENDENCIES')}</span>`;

// ---------- separadores
const TABS = [['packs', 'Packs'], ['rules', 'Rules'], ['decs', 'Decoders'], ['tech', 'Techniques & Playbooks'], ['resp', 'Responses'], ['groups', 'Agent groups'], ['gaps', 'Coverage'], ['cart', 'Install (cart)']];
function nav() {
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button data-t="${k}" class="${state.tab === k ? 'on' : ''}">${_(l)}${k === 'cart' ? `<span class="n">${state.cart.size}</span>` : ''}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { if (b.dataset.t !== state.tab) Object.assign(state, {status: '', lic: '', rf: '', gap: ''}); go(b.dataset.t); });
}
function go(t) { state.tab = t; state.limit = 60; history.replaceState(null, '', '#' + t); render(); window.scrollTo(0, 0); }
function areaSelect() {
  return `<select id="fArea" aria-label="${_('Area')}"><option value="">${_('All areas')}</option>${Object.keys(D.areas).map(a => `<option value="${a}" ${state.area === a ? 'selected' : ''} title="${esc(areaDesc(a))}">${esc(a)}</option>`).join('')}</select>`;
}
function bindFilters() {
  const fa = $('#fArea'); if (fa) fa.onchange = e => { state.area = e.target.value; state.limit = 60; render(); };
  const fs = $('#fStatus'); if (fs) fs.onchange = e => { state.status = e.target.value; state.limit = 60; render(); };
  const fl = $('#fLic'); if (fl) fl.onchange = e => { state.lic = e.target.value; state.limit = 60; render(); };
  const so = $('#fSort'); if (so) so.onchange = e => { state.sort = e.target.value; render(); };
  const rf = $('#fRule'); if (rf) rf.onchange = e => { state.rf = e.target.value; state.limit = 60; render(); };
  const gp = $('#fGap'); if (gp) gp.onchange = e => { state.gap = e.target.value; state.limit = 60; render(); };
  const m = $('#more'); if (m) m.onclick = () => { state.limit += 120; render(); };
}
function moreBtn(n) { return n > state.limit ? `<div class="more"><button class="btn" id="more">${_('Show more ({n})', {n: n - state.limit})}</button></div>` : ''; }
const kpiLink = (v, l, c, to, active, sub = '') => `<a class="kpi ${c} ${active ? 'active' : ''}" href="#${to[0]}" data-to='${esc(JSON.stringify(active ? [to[0], Object.fromEntries(Object.keys(to[1]).map(k => [k, ''])), to[2]] : to))}' title="${active ? _('Clear this filter') : _('Show the matching items')}"><div class="l">${l}</div><div class="v">${v}</div>${sub ? `<div class="l">${sub}</div>` : ''}<div class="go">${active ? _('filter active · click to clear') : _('see list') + ' →'}</div></a>`;
const opt = (v, cur, label) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${label}</option>`;
const empty = cols => `<tr><td colspan="${cols}" class="empty">${_('No results.')}</td></tr>`;

// ---------- PACKS
function renderPacks() {
  const ws = words();
  let list = D.packs.map((p, i) => [p, i]).filter(([p]) =>
    (!state.area || p.a === state.area) &&
    (!state.status || (state.status === 'ok' && p.ok && !p.w) || (state.status === 'warn' && p.ok && p.w) || (state.status === 'bad' && !p.ok) || (state.status === 'sa' && p.sa)
      || (state.status === 'loads' && p.ok) || (state.status === 'tested' && p.tests && p.tests.samples > p.tests.not_tested)
      || (state.status === 'shadowed' && p.tests && p.tests.sombreado > 0)) &&
    (!state.lic || (state.lic === 'yes' ? p.lic !== 'NONE' : p.lic === 'NONE')) &&
    (!ws.length || match([p.f, p.t, p.s, p.a, p.grp.join(' '), p.lic].join(' '), ws)));
  const cards = list.slice(0, state.limit).map(([p, i]) => {
    const [cls, lbl] = packStatus(p);
    return `<article class="card" data-p="${i}" tabindex="0">
      <div class="area" title="${esc(areaDesc(p.a))}">${esc(areaName(p.a))}</div>
      <h3>${esc(p.t)}</h3>
      <div class="src">${esc(p.s)}</div>
      <div class="nums"><span><b>${p.r}</b> ${_('rules')}</span><span><b>${p.d}</b> ${_('decoders')}</span><span><b>${p.tech ? pct(p.tpb, p.tech) + '%' : '—'}</b> ${_('playbooks')}</span></div>
      <div class="badges"><span class="b ${cls}">${lbl}</span>${saBadge(p)}${licBadge(p.lic)}${testBadge(p)}${state.cart.has(p.f) ? `<span class="b info">${_('IN CART')}</span>` : ''}</div>
    </article>`;
  }).join('');
  return `<p class="lead">${_('Each pack is a source folder: original community files, validated on their own on top of the official ruleset {v}. Open a pack to view and copy its files, or add several to the cart to generate an install script.', {v: esc(D.stats.official_reference.split(' ')[1])})}</p>
  <div class="filters">${areaSelect()}
    <select id="fStatus" aria-label="${_('Status')}">${opt('', state.status, _('Any status'))}${opt('loads', state.status, _('Loads'))}${opt('ok', state.status, _('Loads without warnings'))}${opt('warn', state.status, _('Loads with warnings'))}${opt('bad', state.status, _('Does not load'))}${opt('sa', state.status, _('Standalone'))}${opt('tested', state.status, _('Decoders tested on real samples'))}${opt('shadowed', state.status, _('With shadowed samples'))}</select>
    <select id="fLic" aria-label="${_('License')}">${opt('', state.lic, _('Any license'))}${opt('yes', state.lic, _('With license'))}${opt('no', state.lic, _('No license'))}</select>
    <span class="count">${_('{n} of {m} packs', {n: list.length, m: D.packs.length})}</span></div>
  ${list.length ? `<div class="grid">${cards}</div>` : `<div class="empty">${_('No pack matches the search.')}</div>`}${moreBtn(list.length)}`;
}

// ---------- REGRAS
function renderRules() {
  const ws = words();
  let n = 0; const rows = [];
  for (const r of D.rules) {
    const p = D.packs[r[4]];
    if (state.area && p.a !== state.area) continue;
    if (state.rf === 'conflict' && !r[5]) continue;
    if (state.rf === 'normalized' && r[7] !== 'normalizado') continue;
    if (state.rf === 'invalid' && r[7] !== 'inválido') continue;
    if (state.rf === 'lvl12' && r[1] < 12) continue;
    if (ws.length && !match(r[0] + ' ' + r[2] + ' ' + r[3] + ' ' + r[6] + ' ' + p.t + ' ' + p.s, ws)) continue;
    if (n++ < state.limit) rows.push(`<tr class="click" data-p="${r[4]}" data-rule="${esc(r[0])}"><td>${esc(r[0])}</td><td class="num">${r[1]}</td><td>${esc(r[2])}</td>
      <td>${esc(r[3].replace(/,/g, ' '))}</td><td class="hide-sm">${esc(p.t)}<br><span class="pct">${esc(p.s)}</span></td>
      <td>${r[5] ? `<span class="b ${r[5].startsWith('oficial: colisão') ? 'bad' : 'warn'}">${esc(V(r[5]))}</span>` : ''}</td></tr>`);
  }
  return `<p class="lead">${_('Every rule in the registry. Search by ID, description, ATT&amp;CK technique (normalized) or group. "Conflict" means the same ID exists in another source: do not load both packs together without renumbering.')}</p>
  <div class="filters">${areaSelect()}
    <select id="fRule" aria-label="${_('Filter')}">${opt('', state.rf, _('All rules'))}${opt('conflict', state.rf, _('ID in conflict'))}${opt('normalized', state.rf, _('MITRE only after normalization'))}${opt('invalid', state.rf, _('MITRE invalid (discontinued technique)'))}${opt('lvl12', state.rf, _('Level ≥12'))}</select>
    <span class="count">${_('{n} rules', {n})}</span></div>
  <div class="tablewrap"><table><thead><tr><th>ID</th><th class="num">${_('Level')}</th><th>${_('Description')}</th><th>ATT&amp;CK</th><th class="hide-sm">${_('Pack')}</th><th>${_('Conflict')}</th></tr></thead><tbody>${rows.join('') || empty(6)}</tbody></table></div>${moreBtn(n)}`;
}

// ---------- DECODERS
const CONCEPTS = [['source.ip', 'source IP'], ['destination.ip', 'destination IP'], ['user.name', 'user'], ['source.port', 'source port'],
  ['event.action', 'action'], ['process.name', 'process'], ['url.original', 'URL']];
let ECSMAP = null;
function fieldEcs(f) { if (!ECSMAP) { ECSMAP = new Map(D.dfields.map(x => [x[0], x[3]])); } return ECSMAP.get(f) || ''; }
function renderDecs() {
  const ws = words(), st = state.status;
  let n = 0; const rows = [];
  for (const d of D.decs) {
    const p = D.packs[d[2]], col = D.dcoll[d[0]];
    if (state.area && p.a !== state.area) continue;
    if (st === 'col' && !(d[3] && col && !col.off)) continue;
    if (st === 'offname' && !(d[3] && col && col.off)) continue;
    if (st === 'root' && !d[3]) continue;
    if (st === 'child' && d[3]) continue;
    if (st === 'noecs' && !d[6].split(',').some(f => f && !fieldEcs(f))) continue;
    if (ws.length && !match(d[0] + ' ' + d[1] + ' ' + d[6] + ' ' + p.t + ' ' + p.s, ws)) continue;
    if (n++ >= state.limit) continue;
    const flds = d[6].split(',').filter(Boolean);
    rows.push(`<tr class="click" data-p="${d[2]}"><td><b>${esc(d[0])}</b>${d[3] ? '' : `<br><span class="pct">↳ ${esc(d[1])}</span>`}</td>
      <td>${d[3] ? `<span class="b info">${_('ROOT')}</span>` : `<span class="b mut">${_('child')}</span>`} ${d[4] ? `<span class="b mut">${esc(d[4])}</span>` : ''}</td>
      <td class="hide-sm">${esc(d[5] || '—')}</td>
      <td>${flds.slice(0, 8).map(f => `<code title="${esc(fieldEcs(f) ? 'ECS: ' + fieldEcs(f) : _('no ECS match'))}">${esc(f)}</code>`).join(' ')}${flds.length > 8 ? ` <span class="pct">+${flds.length - 8}</span>` : ''}</td>
      <td class="hide-sm">${esc(p.t)}<br><span class="pct">${esc(p.s)}</span></td>
      <td>${d[3] && col ? `<span class="b ${col.off ? 'warn' : 'bad'}" title="${esc(col.p.map(i => D.packs[i].s).join(', '))}">${col.off ? _('OFFICIAL NAME') : _('COLLIDES ×{n}', {n: col.p.length})}</span>` : ''}</td></tr>`);
  }
  const S = D.stats.decoders_detail || {};
  const variants = CONCEPTS.map(([ecs, label]) => { const v = D.dfields.filter(f => f[3] === ecs).sort((a, b) => b[1] - a[1]);
    return v.length ? `<tr><td><b>${_(label)}</b><br><code>${ecs}</code></td><td>${v.slice(0, 8).map(f => `<code>${esc(f[0])}</code> <span class="pct">${f[1]}</span>`).join(' · ')}${v.length > 8 ? ` · +${v.length - 8}` : ''}</td></tr>` : ''; }).join('');
  return `<p class="lead">${_('The sources\' decoders: how they identify the log, the regex engine and the fields they produce (hover a field to see the suggested ECS field). Root decoders with the same name in another source or in the official ruleset shadow each other: their children share the name and the first one loaded that matches extracts the fields.')}</p>
  <div class="kpis">
    ${kpiLink(`${S.roots}/${S.children}`, _('decoders (root / children)'), '', ['decs', {status: 'root'}, 'decs-table'], st === 'root')}
    ${kpiLink(S.root_collisions_between_sources, _('root names colliding between sources'), 'bad', ['decs', {status: 'col'}, 'decs-table'], st === 'col')}
    ${kpiLink(S.root_names_also_official, _('root names of an official decoder'), '', ['decs', {status: 'offname'}, 'decs-table'], st === 'offname')}
    ${kpiLink(S.distinct_fields, _('distinct field names (with ECS)'), '', ['decs', {status: 'noecs'}, 'decs-table'], st === 'noecs', _('{n} mapped · {p}% of uses', {n: S.fields_with_ecs, p: S.field_uses_with_ecs_pct}) + ' · ' + _('filter: decoders with unmapped fields'))}
  </div>
  <h2>${_('Same concept, different names')}</h2>
  <div class="tablewrap"><table><thead><tr><th>${_('Concept (ECS)')}</th><th>${_('Names used by the decoders (uses)')}</th></tr></thead><tbody>${variants}</tbody></table></div>
  <h2 id="decs-table">${_('Decoders')}</h2>
  <div class="filters">${areaSelect()}
    <select id="fStatus" aria-label="${_('Type')}">${opt('', st, _('All'))}${opt('root', st, _('Roots only'))}${opt('child', st, _('Children only'))}${opt('col', st, _('Colliding roots only'))}${opt('offname', st, _('Roots with an official name'))}${opt('noecs', st, _('With fields not mapped to ECS'))}</select>
    <span class="count">${_('{n} decoders', {n})}</span></div>
  <div class="tablewrap"><table><thead><tr><th>${_('Decoder')}</th><th>${_('Type')}</th><th class="hide-sm">${_('Regex')}</th><th>${_('Fields')}</th><th class="hide-sm">${_('Pack')}</th><th>${_('Collision')}</th></tr></thead><tbody>${rows.join('') || empty(6)}</tbody></table></div>${moreBtn(n)}`;
}

// ---------- TÉCNICAS & PLAYBOOKS
function docsFor(t) { const base = t.split('.')[0]; return D.pbs.filter(d => d[4].split(',').some(x => x === t || x === base)); }
const pbLink = d => `<a href="${esc(d[6])}" target="_blank" rel="noopener">${esc(d[0].split('/')[0])}: ${esc(d[2])}</a>`;
function renderTech() {
  const ws = words();
  const tactic = state.status;
  let list = D.techs.filter(t => (!state.area || t[6].split(';').includes(state.area)) && (!tactic || t[2].split(';').includes(tactic)) &&
    (!state.gap || (state.gap === 'nopb' && t[4] && !t[7]) || (state.gap === 'nocont' && t[4] && !t[9]) || (state.gap === 'lvl12' && t[4])) &&
    (!ws.length || match(t.join(' ') + ' ' + docsFor(t[0]).map(d => d[3]).join(' '), ws)));
  list = list.slice().sort(state.sort === 'gap' ? (a, b) => (!!a[7] - !!b[7]) || b[4] - a[4] : (a, b) => b[3] - a[3]);
  const tactics = [...new Set(D.techs.flatMap(t => t[2].split(';')).filter(Boolean))].sort();
  const rows = list.slice(0, state.limit).map(t => {
    const docs = docsFor(t[0]).filter(d => d[1].startsWith('procedimental')), cms = docsFor(t[0]).filter(d => d[1].startsWith('contramedida'));
    return `<tr><td><a href="https://attack.mitre.org/techniques/${t[0].replace('.', '/')}/" target="_blank" rel="noopener">${t[0]}</a><br><span class="pct">${esc(t[1])}</span></td>
      <td class="hide-sm">${esc(t[2].replace(/;/g, ', '))}</td><td class="num">${t[3]}</td><td class="num">${t[4] ? `<b>${t[4]}</b>` : '0'}</td>
      <td>${docs.length ? docs.slice(0, 4).map(pbLink).join('<br>') + (docs.length > 4 ? `<br><span class="pct">+${docs.length - 4}</span>` : '') : `<span class="b bad">${_('NO PLAYBOOK')}</span>`}</td>
      <td>${cms.length ? cms.slice(0, 3).map(d => `<span title="${esc(d[3])}">${esc(d[2])}</span>`).join(' ') + (cms.length > 3 ? ` +${cms.length - 3}` : '') : '—'}</td>
      <td class="num">${t[9] ? `<span class="b ok">${t[9]}</span>` : '<span class="b mut">0</span>'}</td>
      <td class="num hide-sm">${t[11] ? `<b>${t[12]}</b>/${t[11]}` : '—'}</td>
      <td><button class="btn small" data-tq="${t[0]}">${_('Rules')}</button></td></tr>`;
  }).join('');
  return `<p class="lead">${_('ATT&amp;CK techniques covered by the registry\'s rules, with the procedural playbooks (ADORSYS, GuardSight, austinsonger) and the CISA COUN7ER countermeasures that match them. A playbook for a parent technique covers its sub-techniques.')}</p>
  <div class="filters">${areaSelect()}
    <select id="fStatus" aria-label="${_('Tactic')}">${opt('', state.status, _('All tactics'))}${tactics.map(t => opt(t, state.status, t)).join('')}</select>
    <select id="fGap" aria-label="${_('Gap')}">${opt('', state.gap, _('All techniques'))}${opt('lvl12', state.gap, _('With level ≥12 rules'))}${opt('nopb', state.gap, _('Level ≥12 without playbook'))}${opt('nocont', state.gap, _('Level ≥12 without containment'))}</select>
    <select id="fSort" aria-label="${_('Sort')}">${opt('gap', state.sort, _('Gaps first'))}${opt('rules', state.sort, _('Most rules'))}</select>
    <span class="count">${_('{n} techniques', {n: list.length})}</span></div>
  <div class="tablewrap"><table><thead><tr><th>${_('Technique')}</th><th class="hide-sm">${_('Tactics')}</th><th class="num">${_('Rules')}</th><th class="num">${_('Level ≥12')}</th><th>${_('Playbooks')}</th><th>${_('CISA countermeasures')}</th><th class="num">${_('Containment')}</th><th class="num hide-sm" title="${_('Sigma high+critical / total rules in SigmaHQ')}">Sigma</th><th></th></tr></thead><tbody>${rows || empty(9)}</tbody></table></div>${moreBtn(list.length)}`;
}

// ---------- RESPOSTAS
const impactCls = i => i === 'destrutivo' ? 'fill-bad' : i.startsWith('contenção') ? 'warn' : 'mut';
function renderResp() {
  const ws = words();
  const list = D.resps.filter(r => (!state.status || r[6] === state.status) && (!ws.length || match(r.join(' ') + ' ' + [r[3], r[4], r[6]].map(V).join(' '), ws)));
  const rows = list.slice(0, state.limit).map(r => `<tr class="${r[9].length ? 'click' : ''}" ${r[9].length ? `data-p="${r[9][0]}"` : ''}>
      <td><b>${esc(r[2])}</b><br><span class="pct">${esc(r[1])} · ${esc(r[0])}</span></td><td>${esc(V(r[3]))}</td>

function cartPacks() { return D.packs.map((p, i) => [p, i]).filter(([p]) => state.cart.has(p.f)); }

  const rank = new Map([...idxs].sort((a, b) => packPrefix(D.packs[a]) + '__' < packPrefix(D.packs[b]) + '__' ? -1 : 1).map((x, n) => [x, n]));

  ${noLic.length ? `<div class="alert warn"><b>${_('No license')}</b>${noLic.map(([p]) => esc(p.s)).join(', ')} ${_('— internal use only.')}</div>` : ''}
  <div class="tablewrap"><table><thead><tr><th>${_('Pack')}</th><th class="num">${_('Rules')}</th><th>${_('Status')}</th><th>${_('Agent groups')}</th><th></th></tr></thead><tbody>
  ${sel.map(([p, i]) => `<tr><td class="click" data-p="${i}"><b>${esc(p.t)}</b><br><span class="pct">${esc(p.s)}</span></td><td class="num">${p.r}</td><td><span class="b ${packStatus(p)[0]}">${packStatus(p)[1]}</span></td><td>${p.grp.map(esc).join(', ') || '—'}</td><td><button class="btn small" data-rm="${esc(p.f)}">${_('Remove')}</button></td></tr>`).join('')}
  </tbody></table></div>
  <div class="filters" style="margin-top:18px"><button class="btn primary" id="mk">${_('Generate install script')}</button><button class="btn" id="clear">${_('Empty cart')}</button></div>
  <div id="script"></div>`;
}

// ---------- render
function render() {
  nav();
  const m = $('#main');
  m.innerHTML = {packs: renderPacks, rules: renderRules, decs: renderDecs, tech: renderTech, resp: renderResp, groups: renderGroups, gaps: renderGaps, cart: renderCart}[state.tab]();
  bindFilters();
  m.querySelectorAll('[data-p]').forEach(el => {
    const open = () => showPack(+el.dataset.p, el.dataset.rule ? 'files' : 'resumo', el.dataset.rule || null);
    el.onclick = e => { if (e.target.closest('a,button[data-rm]')) return; open(); };
    el.onkeydown = e => { if (e.key === 'Enter') open(); };
  });
  m.querySelectorAll('[data-tq]').forEach(el => el.onclick = () => { state.q = el.dataset.tq; $('#q').value = state.q; go('rules'); });
  m.querySelectorAll('[data-to]').forEach(el => el.onclick = e => {
    e.preventDefault(); const [tab, set, anchor] = JSON.parse(el.dataset.to);
    if (tab !== state.tab || !anchor) { Object.assign(state, {q: '', area: '', status: '', lic: '', rf: '', gap: ''}); $('#q').value = ''; }
    Object.assign(state, set); go(tab);
    if (anchor) { const h = document.getElementById(anchor); if (h) window.scrollTo({top: h.getBoundingClientRect().top + scrollY - $('header').offsetHeight - 12, behavior: 'smooth'}); }
  });
  m.querySelectorAll('[data-jump]').forEach(el => el.onclick = e => { e.preventDefault(); const h = document.getElementById(el.dataset.jump), top = h.getBoundingClientRect().top + scrollY - $('header').offsetHeight - 12; window.scrollTo({top, behavior: 'smooth'}); });
  m.querySelectorAll('[data-area]').forEach(el => el.onclick = () => { state.area = el.dataset.area; state.status = ''; go('packs'); });
  m.querySelectorAll('[data-g]').forEach(el => el.onclick = () => showGroup(+el.dataset.g));
  m.querySelectorAll('[data-add]').forEach(el => el.onclick = () => { state.cart.add(D.packs[+el.dataset.add].f); saveCart(); render(); });
  m.querySelectorAll('[data-rm]').forEach(el => el.onclick = () => { state.cart.delete(el.dataset.rm); saveCart(); render(); });
  const mk = $('#mk');
  if (mk) mk.onclick = async () => {
    mk.disabled = true; mk.textContent = _('Generating…');
    const sc = await buildScript(cartPacks());
    $('#script').innerHTML = `<h2>install-wazuh-packs.sh</h2><div class="filters"><button class="btn small" id="cp">${_('Copy')}</button><button class="btn small" id="dl">${_('Download .sh')}</button><span class="count">${(sc.length / 1024).toFixed(0)} KB</span></div><pre>${esc(sc)}</pre>`;
    $('#cp').onclick = () => copy(sc, _('Script')); $('#dl').onclick = () => download('install-wazuh-packs.sh', sc);
    mk.disabled = false; mk.textContent = _('Generate install script');
  };
  const cl = $('#clear'); if (cl) cl.onclick = () => { state.cart.clear(); saveCart(); render(); };
}
let deb;
$('#q').addEventListener('input', e => { clearTimeout(deb); deb = setTimeout(() => { state.q = e.target.value; state.limit = 60; render(); }, 150); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape') closeDrawer();
});
$('#ov').onclick = closeDrawer;
$('#cartBtn').onclick = () => go('cart');
// PRESS ▮ TO CONTINUE: volta ao topo e põe o cursor na pesquisa
$('#press').onclick = () => { closeDrawer(); window.scrollTo({top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); setTimeout(() => $('#q').focus({preventScroll: true}), 350); };
// manter o separador ao mudar de idioma
$('#lang').addEventListener('click', () => { $('#lang').href = $('#lang').getAttribute('href').split('#')[0] + '#' + state.tab; });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.some(([k]) => k === h) && h !== state.tab) { state.tab = h; render(); } });
(async () => {
  try {
    D = await unpack('meta');
    const h = location.hash.slice(1); if (TABS.some(([k]) => k === h)) state.tab = h;
    saveCart(); render();
  } catch (e) {
    $('#main').innerHTML = `<div class="alert"><b>${_('Could not load the data')}</b>${esc(e.message)} — ${_('a recent browser is required (DecompressionStream).')}</div>`;
  }
})();
</script>
</body>
</html>
