<!-- Grupo pack-detect-new-agents: gerado por tools/build.py a partir de catalog/collection_entries.csv; rever caminhos antes de usar -->
<agent_config os="Linux">
  <wodle name="command">
    <disabled>no</disabled>
    <tag>new-agent-detector</tag>
    <command>/opt/scripts/detect_new_agents.py</command>
    <interval>5m</interval>
    <run_on_start>yes</run_on_start>
    <timeout>60</timeout>
    <ignore_output>yes</ignore_output>
  </wodle>
</agent_config>
