<!-- Grupo pack-vuln-inventory: gerado por tools/build.py a partir de catalog/collection_entries.csv; rever caminhos antes de usar -->
<agent_config os="Linux">
  <wodle name="command">
    <disabled>no</disabled>
    <tag>snyk-scan</tag>
    <command>/usr/bin/bash /var/ossec/wodles/command/snyk_scan.sh</command>
    <interval>24h</interval>
    <ignore_output>yes</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>0</timeout>
  </wodle>
</agent_config>
