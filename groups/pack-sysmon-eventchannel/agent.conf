<!-- Grupo pack-sysmon-eventchannel: gerado por tools/build.py a partir de catalog/collection_entries.csv; rever caminhos antes de usar -->
<agent_config os="Windows">
  <wodle name="command">
    <disabled>no</disabled>
    <tag>autoruns</tag>
    <command>Powershell.exe -executionpolicy bypass -File "C:\Program Files\Sysinternals\autoruns.ps1"</command>
    <interval>1d</interval>
    <ignore_output>yes</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>0</timeout>
  </wodle>
  <wodle name="command">
    <disabled>no</disabled>
    <tag>logonsessions</tag>
    <command>Powershell.exe -executionpolicy bypass -File "C:\Program Files\Sysinternals\logonsessions.ps1"</command>
    <interval>1h</interval>
    <ignore_output>yes</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>0</timeout>
  </wodle>
  <wodle name="command">
    <disabled>no</disabled>
    <tag>sigcheck</tag>
    <command>Powershell.exe -executionpolicy bypass -File "C:\Program Files\Sysinternals\sigcheck.ps1"</command>
    <interval>1d</interval>
    <ignore_output>yes</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>0</timeout>
  </wodle>
  <wodle name="command">
  		<disabled>no</disabled>
  		<tag>windows_chainsaw</tag>
  		<command>Powershell.exe -executionpolicy bypass -File "C:\Program Files\socfortress\chainsaw.ps1"</command>
  		<interval>24h</interval>
  		<ignore_output>yes</ignore_output>
  		<run_on_start>yes</run_on_start>
  		<timeout>0</timeout>
  	</wodle>
</agent_config>
