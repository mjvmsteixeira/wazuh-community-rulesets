<!-- Grupo pack-socradar: gerado por tools/build.py a partir de catalog/collection_entries.csv; rever caminhos antes de usar -->
<agent_config os="Linux">
  <wodle name="command">
    <disabled>no</disabled>
    <tag>socradar</tag>
    <command>/var/ossec/wodles/socradar/socradar</command>
    <interval>1m</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>300</timeout>
  </wodle>
</agent_config>
