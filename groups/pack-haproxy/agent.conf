<!-- Grupo pack-haproxy: gerado por tools/build.py a partir de catalog/collection_entries.csv; rever caminhos antes de usar -->
<agent_config os="Linux">
  <localfile>  
      <log_format>full_command</log_format>
      <command>ss -nputw | egrep '"sh"|"bash"|"csh"|"ksh"|"zsh"' | awk '{ print $5 "|" $6 }'</command>
      <alias>webshell connections</alias>
      <frequency>120</frequency>
    </localfile>
</agent_config>
