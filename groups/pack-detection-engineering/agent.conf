<!-- Grupo pack-detection-engineering: gerado por tools/build.py a partir de catalog/collection_entries.csv; rever caminhos antes de usar -->
<agent_config os="Darwin">
  <localfile>
      <location>macos</location>
      <log_format>macos</log_format>
      <query type="trace,log,activity" level="info">
        (process == "sudo") or
        (process == "sessionlogoutd" and message contains "logout is complete.") or
        (process == "sshd") or
        (process == "tccd" and message contains "Update Access Record") or
        (message contains "SessionAgentNotificationCenter") or
        (process == "screensharingd" and message contains "Authentication") or
        (process == "securityd" and eventMessage contains "Session" and subsystem == "com.apple.securityd")
      </query>
    </localfile>
  <localfile>
      <log_format>full_command</log_format>
      <command>top -l 1 | grep 'CPU usage' | awk '{print $3, $5, ($3+$5)*100/($3+$5+$7)"%", $7}'</command>
      <alias>cpu_metrics</alias>
      <out_format>$(timestamp) $(hostname) cpu_usage_check: $(log)</out_format>
      <frequency>30</frequency>
    </localfile>
  <localfile>
      <log_format>full_command</log_format>
      <command>top -l 1 | grep 'Load Avg' | awk '{print $3, $4, $5}'</command>
      <alias>load_average_metrics</alias>
      <out_format>$(timestamp) $(hostname) load_average_check: $(log)</out_format>
      <frequency>30</frequency>
    </localfile>
  <localfile>
      <log_format>full_command</log_format>
      <command>top -l 1 | grep Networks | awk '$NF=="out."{print $3,$5}'</command>
      <alias>network_metrics</alias>
      <out_format>$(timestamp) $(hostname) network_check: $(log)</out_format>
      <frequency>30</frequency>
    </localfile>
  <localfile>
      <log_format>full_command</log_format>
      <command>top -l 1 | grep PhysMem | awk '$NF=="unused."{print $2,$(NF-1)}'</command>
      <alias>memory_metrics</alias>
      <out_format>$(timestamp) $(hostname) memory_check: $(log)</out_format>
      <frequency>30</frequency>
    </localfile>
  <localfile>
      <log_format>full_command</log_format>
      <command>top -l 1 | grep PhysMem | awk '$NF=="unused."{print ($2*100)/($2+$(NF-1))}'</command>
      <alias>memory_health</alias>
      <out_format>$(timestamp) $(hostname) memory_health: $(log)</out_format>
      <frequency>30</frequency>
    </localfile>
</agent_config>
<agent_config os="Linux">
  <localfile>
      <location>/var/log/sysmon/sysmon.log</location>
      <log_format>syslog</log_format>
    </localfile>
  <localfile>
      <log_format>json</log_format>
      <location>/var/log/usb_monitor.log</location>
    </localfile>
  <localfile>
      <location>/var/log/wazuh-macos-uls.log</location>
      <log_format>json</log_format>
    </localfile>
  <localfile>
      <log_format>command</log_format>
      <command>df -P</command>
      <frequency>360</frequency>
    </localfile>
  <localfile>
      <log_format>full_command</log_format>
      <command>df -h | awk '$NF=="/"{print $2,$3,$4,$3+$4"Gi"}'</command>
      <alias>disk_metrics</alias>
      <out_format>$(timestamp) $(hostname) disk_check: $(log)</out_format>
      <frequency>30</frequency>
    </localfile>
  <localfile>
      <log_format>full_command</log_format>
      <command>df -h | awk '$NF=="/"{print $3*100/($3+$4)}'</command>
      <alias>disk_health</alias>
      <out_format>$(timestamp) $(hostname) disk_health: $(log)</out_format>
      <frequency>30</frequency>
    </localfile>
  <localfile>
      <log_format>full_command</log_format>
      <command>last -n 20</command>
      <frequency>360</frequency>
    </localfile>
  <localfile>
      <log_format>full_command</log_format>
      <command>ss -tulpn</command>
      <alias>listening ports</alias>
      <frequency>360</frequency>
    </localfile>
</agent_config>
