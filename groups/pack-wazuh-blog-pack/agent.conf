  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/mimecast/log/mimecast.log</location>
  </localfile>
  <localfile>
      <log_format>json</log_format>
      <location>/var/log/mongodb/auditLog.json</location>
    </localfile>
  <localfile>
      <log_format>json</log_format>
      <location>/var/log/mongodb_atlas/atlas_events.json</location>
    </localfile>
  <localfile>
      <log_format>syslog</log_format>
      <location>/var/log/openvpnas.log</location>
    </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/postgresql/postgresql-16-main.log</location>
  </localfile>
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/sentinelone.json</location>
  </localfile>
  <localfile>
      <log_format>syslog</log_format>
      <location>/var/log/sentinelone.log</location>
  </localfile>
  <localfile>
      <log_format>syslog</log_format>
      <location>/var/log/syslog</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/test.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/test_file.log</location>
  </localfile>
  <localfile>
      <log_format>json</log_format>
      <location>/var/log/tetragon/tetragon.log</location>
      <out_format>$(timestamp) $(hostname) tetragon-events: $(log)</out_format>
    </localfile>
  <localfile>
      <log_format>syslog</log_format>
      <location>/var/log/vault_audit.log</location>
    </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/vmware-esxi.log</location>
    <out_format>vmware-esxi: $(log)</out_format>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/yara.log</location>
  </localfile>
  <localfile>
      <log_format>command</log_format>
      <command>df -P</command>
      <frequency>360</frequency>
    </localfile>
  <localfile>
      <log_format>command</log_format>
      <command>docker ps --format "{{.Image}} {{.Names}} {{.Status}}"</command>
      <alias>docker container ps</alias>
      <frequency>120</frequency>
      <out_format>$(timestamp) $(hostname) docker-container-health: $(log)</out_format>
    </localfile>
  <localfile>
      <log_format>command</log_format>
      <command>docker stats --format "{{.Container}} {{.Name}} {{.CPUPerc}} {{.MemUsage}} {{.MemPerc}} {{.NetIO}}" --no-stream</command>
      <alias>docker container stats</alias>
      <frequency>120</frequency>
      <out_format>$(timestamp) $(hostname) docker-container-resource: $(log)</out_format>
    </localfile>
  <localfile>
      <log_format>command</log_format>
      <command>printenv LD_PRELOAD</command>
      <alias>check for LD_PRELOAD envar</alias>
      <frequency>180</frequency>
    </localfile>
  <localfile>
      <log_format>command</log_format>
      <command>ps -ef | grep "[/]etc/rc.local" | awk '{print $3}'</command>
      <alias>ppid of rc_local</alias>
      <frequency>180</frequency>
    </localfile>
  <localfile>
      <log_format>command</log_format>
      <command>systemctl show rc-local.service --property=ActiveState | awk -F"=" '{print $2}'</command>
      <alias>state of rc_local service</alias>
      <frequency>180</frequency>
    </localfile>
  <localfile>
      <log_format>full_command</log_format>
      <command>cat /etc/cron.hourly/0 | grep 'suhelper'</command>
      <alias>check cron job for root user creation</alias>
      <frequency>90</frequency>
  </localfile>
  <localfile>
      <log_format>full_command</log_format>
      <command>cat /etc/passwd | grep 'suhelper'</command>
      <alias>check root user creation</alias>
      <frequency>90</frequency>
  </localfile>
  <localfile>
       <log_format>full_command</log_format>
       <command>df -B1 | awk '$NF=="/"{print $3,$4}'</command>
       <alias>disk_metrics</alias>
       <out_format>$(timestamp) $(hostname) disk_check: $(log)</out_format>
       <frequency>30</frequency>
    </localfile>
  <localfile>
      <log_format>full_command</log_format>
      <command>df -h | awk '$NF=="/"{print $2,$3,$4,$3+$4"Gi"}'</command>
      <alias>disk_metrics</alias>
      <out_format>$(timestamp) $(hostname) disk_check: $(log)</out_format>
      <frequency>30</frequency>
    </localfile>
  <localfile>
      <log_format>full_command</log_format>
      <command>df -h | awk '$NF=="/"{print $3*100/($3+$4)}'</command>
      <alias>disk_health</alias>
      <out_format>$(timestamp) $(hostname) disk_health: $(log)</out_format>
      <frequency>30</frequency>
    </localfile>
  <localfile>
       <log_format>full_command</log_format>
       <command>echo $(top -bn1 | grep Cpu | awk '{print $2+$4+$6+$12+$14+$16}' ; free -m | awk 'NR==2{printf "%.2f\t\t\n", $3*100/$2 }' ; df -h | awk '$NF=="/"{print $5}'|sed 's/%//g')</command>
       <alias>general_health_metrics</alias>
       <out_format>$(timestamp) $(hostname) general_health_check: $(log)</out_format>
       <frequency>30</frequency>
    </localfile>
  <localfile>
       <log_format>full_command</log_format>
       <command>free --bytes| awk 'NR==2{print $3,$7}'</command>
       <alias>memory_metrics</alias>
       <out_format>$(timestamp) $(hostname) memory_check: $(log)</out_format>
       <frequency>30</frequency>
    </localfile>
  <localfile>
      <log_format>full_command</log_format>
      <command>netstat -tulpn | sed 's/\([[:alnum:]]\+\)\ \+[[:digit:]]\+\ \+[[:digit:]]\+\ \+\(.*\):\([[:digit:]]*\)\ \+\([0-9\.\:\*]\+\).\+\ \([[:digit:]]*\/[[:alnum:]\-]*\).*/\1 \2 == \3 == \4 \5/' | sort -k 4 -g | sed 's/ == \(.*\) ==/:\1/' | sed 1,2d</command>
      <alias>netstat listening ports</alias>
      <frequency>360</frequency>
    </localfile>
  <localfile>
      <log_format>full_command</log_format>
      <command>ss -nputw | egrep '2.58.149.116:9999|185.225.73.196:443'</command>
      <alias>ss listening C2 server port</alias>
      <frequency>90</frequency>
  </localfile>
  <localfile>
      <log_format>full_command</log_format>
      <command>ss -nputw | egrep 'ESTAB  "sh"|"bash"|"csh"|"ksh"|"zsh"' | awk '{ print $5 "|" $6 }'</command>
      <alias>webshell connections</alias>
      <frequency>120</frequency>
    </localfile>
  <localfile>
      <log_format>full_command</log_format>
      <command>ss -nputw | grep -c ':22 ' | awk -F: '$0 &gt; 4'</command>
      <alias>ss listening SSH outbounds</alias>
      <frequency>90</frequency>
  </localfile>
  <localfile>
      <log_format>full_command</log_format>
      <command>top -bn1 | grep "Cpu(s)" | sed "s/.*, *\([0-9.]*\)%* id.*/\1/" | awk '{print 100 - $1"%"}'</command>
      <alias>top cpu usage</alias>
      <frequency>60</frequency>
    </localfile>
  <localfile>
       <log_format>full_command</log_format>
       <command>uptime | grep load | awk '{print $(NF-2),$(NF-1),$NF}' | sed 's/\,\([0-9]\{1,2\}\)/.\1/g'</command>
       <alias>load_average_metrics</alias>
       <out_format>$(timestamp) $(hostname) load_average_check: $(log)</out_format>
       <frequency>30</frequency>
    </localfile>
  <wodle name="command">
      <disabled>no</disabled>
      <tag>dependency-track</tag>
      <command>/var/ossec/custom-script/dependency_track_monitor.sh</command>
      <interval>1d</interval> 
      <ignore_output>no</ignore_output>
      <run_on_start>yes</run_on_start>
      <timeout>0</timeout>
    </wodle>
  <wodle name="command">
    <disabled>no</disabled>
    <command>/var/ossec/custom-script/trivy_scan.sh</command>
    <interval>3d</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>0</timeout>
  </wodle>
  <wodle name="command">
    <disabled>no</disabled>
    <command>/var/ossec/framework/python/bin/python3 /var/ossec/integrations/mimecast.py</command>
    <interval>5m</interval>
    <ignore_output>yes</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>120</timeout>
  </wodle>
  <wodle name="command">
    <disabled>no</disabled>
    <command>/var/ossec/framework/python/bin/python3 /var/ossec/integrations/sentinel_one.py</command>
    <interval>1m</interval>
    <ignore_output>yes</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>0</timeout>
  </wodle>
  <wodle name="command">
      <disabled>no</disabled>
      <tag>ps-list</tag>
      <command>ps -eo user,pid,cmd</command>
      <interval>10s</interval>
      <ignore_output>no</ignore_output>
      <run_on_start>yes</run_on_start>
      <timeout>5</timeout>
  </wodle>
  <wodle name="command">
      <disabled>no</disabled>
      <command>python3 /etc/mongodb_atlas/mongo_atlas.py</command>
      <interval>5m</interval>
      <ignore_output>yes</ignore_output>
      <run_on_start>yes</run_on_start>
      <timeout>180</timeout>
    </wodle>
  <wodle name="command">
      <disabled>no</disabled>
      <command>python3 /etc/snowflake_logs/snow_log_collector.py</command>
      <interval>5m</interval>
      <ignore_output>yes</ignore_output>
      <run_on_start>yes</run_on_start>
      <timeout>180</timeout>
    </wodle>
</agent_config>
<agent_config os="Windows">
