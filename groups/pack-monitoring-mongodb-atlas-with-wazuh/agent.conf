<!-- Grupo pack-monitoring-mongodb-atlas-with-wazuh: gerado por tools/build.py a partir de catalog/collection_entries.csv; rever caminhos antes de usar -->
<agent_config os="Linux">
  <localfile>
      <log_format>json</log_format>
      <location>/var/log/mongodb_atlas/atlas_events.json</location>
    </localfile>
  <wodle name="command">
      <disabled>no</disabled>
      <command>python3 /etc/mongodb_atlas/mongo_atlas.py</command>
      <interval>5m</interval>
      <ignore_output>yes</ignore_output>
      <run_on_start>yes</run_on_start>
      <timeout>180</timeout>
    </wodle>
</agent_config>
