<!-- Grupo pack-orangebox: gerado por tools/build.py a partir de catalog/collection_entries.csv; rever caminhos antes de usar -->
<agent_config os="Linux">
  <localfile>
      <location>/etc/apache2/logs/access_log</location>
      <log_format>apache</log_format>
    </localfile>
  <localfile>
      <location>/usr/local/cpanel/logs/access_log</location>
      <log_format>apache</log_format>
    </localfile>
  <localfile>
      <location>/usr/local/cpanel/logs/cphulkd.log</location>
      <log_format>syslog</log_format>
    </localfile>
  <localfile>
      <location>/usr/local/cpanel/logs/login_log</location>
      <log_format>syslog</log_format>
    </localfile>
  <localfile>
      <location>/var/log/apache2/domlogs/*</location>
      <log_format>apache</log_format>
    </localfile>
  <localfile>
      <location>/var/log/apache2/domlogs/*/*</location>
      <log_format>apache</log_format>
    </localfile>
  <localfile>
      <location>/var/log/exim_mainlog</location>
      <log_format>syslog</log_format>
    </localfile>
  <localfile>
      <location>/var/log/exim_paniclog</location>
      <log_format>syslog</log_format>
    </localfile>
  <localfile>
      <location>/var/log/exim_rejectlog</location>
      <log_format>syslog</log_format>
    </localfile>
  <localfile>
      <location>/var/log/imunify360/imunify360-wafd.log</location>
      <log_format>syslog</log_format>
    </localfile>
  <localfile>
      <location>/var/log/lfd.log</location>
      <log_format>syslog</log_format>
    </localfile>
  <localfile>
      <location>/var/log/maillog</location>
      <log_format>syslog</log_format>
    </localfile>
  <localfile>
      <location>/var/log/messages</location>
      <log_format>syslog</log_format>
    </localfile>
  <localfile>
      <location>/var/log/orangebox-firewall.log</location>
      <log_format>syslog</log_format>
    </localfile>
  <localfile>
      <log_format>journald</log_format>
      <location>journald</location>
    </localfile>
  <localfile>
      <log_format>command</log_format>
      <command>df -P</command>
      <frequency>360</frequency>
    </localfile>
  <localfile>
      <log_format>full_command</log_format>
      <command>last -n 20</command>
      <frequency>360</frequency>
    </localfile>
  <localfile>
      <log_format>full_command</log_format>
      <command>netstat -tulpn | sed 's/\([[:alnum:]]\+\)\ \+[[:digit:]]\+\ \+[[:digit:]]\+\ \+\(.*\):\([[:digit:]]*\)\ \+\([0-9\.\:\*]\+\).\+\ \([[:digit:]]*\/\[[:alnum:]\-]*\).*/\1 \2 == \3 == \4 \5/' | sort -k 4 -g | sed 's/ == \(.*\) ==/:\1/' | sed 1,2d</command>
      <alias>netstat listening ports</alias>
      <frequency>360</frequency>
    </localfile>
</agent_config>
