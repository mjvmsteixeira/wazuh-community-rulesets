<!-- Grupo pack-integrating-sentinelone-xdr-with-wazuh: gerado por tools/build.py a partir de catalog/collection_entries.csv; rever caminhos antes de usar -->
<agent_config os="Linux">
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/sentinelone.json</location>
  </localfile>
  <localfile>
      <log_format>syslog</log_format>
      <location>/var/log/sentinelone.log</location>
  </localfile>
  <wodle name="command">
    <disabled>no</disabled>
    <command>/var/ossec/framework/python/bin/python3 /var/ossec/integrations/sentinel_one.py</command>
    <interval>1m</interval>
    <ignore_output>yes</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>0</timeout>
  </wodle>
</agent_config>
