<!-- Grupo pack-afinacao-ruido: gerado por tools/build.py a partir de catalog/collection_entries.csv; rever caminhos antes de usar -->
<agent_config os="Linux">
  <localfile>
    <log_format>multi-line-regex</log_format>
    <location>/usr/local/jss/logs/JAMFChangeManagement.log</location>
    <multiline_regex match="start" replace="no-replace">^\[</multiline_regex>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/usr/local/jss/logs/jamf-pro-installer.log</location>
  </localfile>
  <localfile>
    <location>journald</location>
    <log_format>journald</log_format>
  </localfile>
  <localfile>
      <log_format>command</log_format>
      <command>docker ps --format "{{.Image}} {{.Names}} {{.Status}}"</command>
      <alias>docker container ps</alias>
      <frequency>120</frequency>
      <out_format>$(timestamp) $(hostname) docker-container-health: $(log)</out_format>
    </localfile>
  <localfile>
      <log_format>command</log_format>
      <command>docker stats --format "{{.Container}} {{.Name}} {{.CPUPerc}} {{.MemUsage}} {{.MemPerc}} {{.NetIO}}" --no-stream</command>
      <alias>docker container stats</alias>
      <frequency>120</frequency>
      <out_format>$(timestamp) $(hostname) docker-container-resource: $(log)</out_format>
    </localfile>
</agent_config>
