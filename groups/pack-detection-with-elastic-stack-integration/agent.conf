<!-- Grupo pack-detection-with-elastic-stack-integration: gerado por tools/build.py a partir de catalog/collection_entries.csv; rever caminhos antes de usar -->
<agent_config os="Windows">
  <localfile>
      <log_format>full_command</log_format>		
      <command>powershell -c "Get-ChildItem -Path 'C:\Users\*' -Recurse -Exclude *.dll,*.exe,*.jpg,*.png,*jpeg,*.sys,*.msi,*.dat | Select-String '(\D|^)5[1-5][0-9]{2}(\ |\-|)[0-9]{4}(\ |\-|)[0-9]{4}(\ |\-|)[0-9]{4}(\D|$)' | Select-Object -Unique path -EV Err -EA SilentlyContinue"</command>
      <alias>PAN scan</alias>
      <frequency>86400</frequency>
    </localfile>
</agent_config>
