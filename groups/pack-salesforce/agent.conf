<!-- Grupo pack-salesforce: gerado por tools/build.py a partir de catalog/collection_entries.csv; rever caminhos antes de usar -->
<agent_config os="Linux">
  <wodle name="command">
    <disabled>no</disabled>
    <run_on_start>yes</run_on_start>
    <interval>1m</interval>
    <tag>salesforce-setup-audit</tag>
    <command>/var/ossec/integrations/custom-salesforce.py</command>
    <timeout>0</timeout>
    <ignore_output>no</ignore_output>
  </wodle>
</agent_config>
