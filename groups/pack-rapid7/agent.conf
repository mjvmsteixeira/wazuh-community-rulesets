<!-- Grupo pack-rapid7: gerado por tools/build.py a partir de catalog/collection_entries.csv; rever caminhos antes de usar -->
<agent_config os="Linux">
  <wodle name="command">
        <tag>Rapid7 integration</tag>
        <command>/var/ossec/framework/python/bin/python3 /var/ossec/integrations/custom-rapid7.py</command>
        <interval>5m</interval>
        <run_on_start>no</run_on_start>
        <ignore_output>yes</ignore_output>
    </wodle>
</agent_config>
