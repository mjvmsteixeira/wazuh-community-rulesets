<!-- Grupo pack-google-threat-intelligence: gerado por tools/build.py a partir de catalog/collection_entries.csv; rever caminhos antes de usar -->
<agent_config os="Linux">
  <wodle name="command">  
          <disabled>no</disabled>
          <tag>gti-sync</tag>
          <command>/var/ossec/framework/python/bin/python3.10 /var/ossec/wodles/gti/gti-sync.py</command>
          <interval>1h</interval>
          <run_on_start>yes</run_on_start>
          <timeout>300</timeout>
      </wodle>
</agent_config>
