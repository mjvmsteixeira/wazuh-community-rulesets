<!-- Grupo pack-m365-inventory: gerado por tools/build.py a partir de catalog/collection_entries.csv; rever caminhos antes de usar -->
<agent_config os="Linux">
  <wodle name="command">
      <disabled>no</disabled>
      <tag>m365_inventory</tag>
      <command>/var/ossec/framework/python/bin/python3 /var/ossec/wodles/m365_inventory/m365_inventory.py</command>
      <interval>10m</interval>
      <run_on_start>yes</run_on_start>
      <ignore_output>yes</ignore_output>
      <timeout>300</timeout>
    </wodle>
</agent_config>
