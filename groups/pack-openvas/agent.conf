<!-- Grupo pack-openvas: gerado por tools/build.py a partir de catalog/collection_entries.csv; rever caminhos antes de usar -->
<agent_config os="Linux">
  <localfile>
      <log_format>json</log_format>
      <location>/opt/openvas/openvas_combined.json</location>
  </localfile>
  <wodle name="command">
    <disabled>no</disabled>
    <tag>openvas_export</tag>
    <command>/var/ossec/bin/openvas_extract.sh</command>
    <interval>1m</interval>
    <run_on_start>yes</run_on_start>
    <timeout>0</timeout>
    <ignore_output>no</ignore_output>
  </wodle>
</agent_config>
