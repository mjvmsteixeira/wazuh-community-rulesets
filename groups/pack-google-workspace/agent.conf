<!-- Grupo pack-google-workspace: gerado por tools/build.py a partir de catalog/collection_entries.csv; rever caminhos antes de usar -->
<agent_config os="Linux">
  <wodle name="command">
       <disabled>no</disabled>
       <tag>gworkspace</tag>
       <command>/var/ossec/wodles/gworkspace/gworkspace -a all -o 2</command>
       <interval>10m</interval>
       <ignore_output>no</ignore_output>
       <run_on_start>yes</run_on_start>
       <timeout>0</timeout>
     </wodle>
</agent_config>
