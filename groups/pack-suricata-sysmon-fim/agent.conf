<!-- Grupo pack-suricata-sysmon-fim: gerado por tools/build.py a partir de catalog/collection_entries.csv; rever caminhos antes de usar -->
<agent_config os="Darwin">
  <localfile>
        <location>macos</location>
        <log_format>macos</log_format>
        <query type="trace,log,activity" level="info">
        (process == "sudo") OR 
        (process == "sshd") OR 
        (process == "tccd" AND message CONTAINS "Update Access Record") OR 
        (process == "securityd" AND eventMessage CONTAINS "Session") OR
        (process == "screensharingd" AND message CONTAINS "Authentication") OR
        (process == "loginwindow") OR
        (process == "authd") OR
        (process == "kernel" AND eventMessage CONTAINS "AMFI")
      </query>
      </localfile>
</agent_config>
<agent_config os="Linux">
  <localfile>
        <log_format>apache</log_format>
        <location>/var/log/apache2/error.log</location>
      </localfile>
  <localfile>
        <log_format>syslog</log_format>
        <location>/var/log/auth.log</location>
      </localfile>
  <localfile>
        <log_format>syslog</log_format>
        <location>/var/log/kern.log</location>
        <ignore>^kernel: \[ *[0-9]+\.[0-9]+\] audit:</ignore>
      </localfile>
  <localfile>
        <log_format>syslog</log_format>
        <location>/var/log/lfd.log</location>
      </localfile>
  <localfile>
        <log_format>syslog</log_format>
        <location>/var/log/syslog</location>
      </localfile>
  <localfile>
        <log_format>full_command</log_format>
        <command>csf -g | tail -20</command>
        <alias>CSF recent blocks</alias>
        <frequency>600</frequency>
      </localfile>
  <localfile>
        <log_format>full_command</log_format>
        <command>csf -t | wc -l</command>
        <alias>CSF temp IP count</alias>
        <frequency>600</frequency>
      </localfile>
  <localfile>
        <log_format>full_command</log_format>
        <command>df -h | grep -vE '^Filesystem|tmpfs|cdrom|udev' | awk '{ print $5 " " $6 }' | grep -E '[8-9][0-9]%|100%'</command>
        <alias>disk_usage_critical</alias>
        <frequency>1800</frequency>
      </localfile>
  <localfile>
        <log_format>full_command</log_format>
        <command>grep "DENY" /etc/csf/csf.deny | wc -l</command>
        <alias>CSF permanent blocks count</alias>
        <frequency>1800</frequency>
      </localfile>
  <localfile>
        <log_format>full_command</log_format>
        <command>ps aux | grep -E '(nc |ncat |/bin/sh|/bin/bash)' | grep -v grep</command>
        <frequency>300</frequency>
      </localfile>
  <localfile>
        <log_format>full_command</log_format>
        <command>ss -tulpn</command>
        <frequency>600</frequency>
      </localfile>
</agent_config>
<agent_config os="Windows">
  <localfile>
