      </localfile>
  <localfile>
        <log_format>eventchannel</log_format>
        <location>Microsoft-Windows-PrintService/Admin</location>
      </localfile>
  <localfile>
        <log_format>eventchannel</log_format>
        <location>Microsoft-Windows-PrintService/Operational</location>
      </localfile>
  <localfile>
        <log_format>eventchannel</log_format>
        <location>Microsoft-Windows-Security-Mitigations/Audit</location>
      </localfile>
  <localfile>
        <log_format>eventchannel</log_format>
        <location>Microsoft-Windows-StorageSpaces-Driver/Operational</location>
      </localfile>
  <!-- fontes pedem queries diferentes para este canal: recolha completa -->
  <localfile>
    <location>Microsoft-Windows-TaskScheduler/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
        <log_format>eventchannel</log_format>
        <location>Microsoft-Windows-TerminalServices-Gateway/Operational</location>
      </localfile>
  <localfile>
        <log_format>eventchannel</log_format>
        <location>Microsoft-Windows-TerminalServices-RdpCoreTS/Operational</location>
      </localfile>
  <!-- fontes pedem queries diferentes para este canal: recolha completa -->
  <localfile>
    <location>Microsoft-Windows-WMI-Activity/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
        <log_format>eventchannel</log_format>
        <location>OAlerts</location>
      </localfile>
  <wodle name="command">
        <disabled>no</disabled>
        <tag>critical-services-status</tag>
        <command>Powershell.exe -ExecutionPolicy Bypass -Command "$services = @('W3SVC','MSSQLSERVER','MSExchangeServiceHost','Spooler','DNS','NTDS','CertSvc','vmms','TermService','WinDefend'); Get-Service -Name $services -ErrorAction SilentlyContinue | Select-Object Name, DisplayName, Status, StartType | ConvertTo-Json -Compress"</command>
        <interval>5m</interval>
        <run_on_start>yes</run_on_start>
        <timeout>30</timeout>
      </wodle>
  <wodle name="command">
        <disabled>no</disabled>
        <tag>certificate-expiration</tag>
        <command>Powershell.exe -ExecutionPolicy Bypass -Command "Get-ChildItem Cert:\LocalMachine\My | Where-Object {$_.NotAfter -lt (Get-Date).AddDays(30)} | Select-Object Subject, Thumbprint, @{N='ExpiresIn';E={($_.NotAfter - (Get-Date)).Days}} | ConvertTo-Json -Compress"</command>
        <interval>1d</interval>
        <run_on_start>yes</run_on_start>
        <timeout>30</timeout>
      </wodle>
  <wodle name="command">
        <disabled>no</disabled>
        <tag>disk-space-monitor</tag>
        <command>Powershell.exe -ExecutionPolicy Bypass -Command "Get-CimInstance Win32_LogicalDisk | Where-Object {$_.DriveType -eq 3} | Select-Object DeviceID, @{N='FreeGB';E={[Math]::Round($_.FreeSpace/1GB,2)}}, @{N='SizeGB';E={[Math]::Round($_.Size/1GB,2)}}, @{N='UsedPercent';E={[Math]::Round((($_.Size-$_.FreeSpace)/$_.Size)*100,2)}} | ConvertTo-Json -Compress"</command>
        <interval>30m</interval>
        <run_on_start>yes</run_on_start>
        <timeout>30</timeout>
      </wodle>
  <wodle name="command">
        <disabled>no</disabled>
        <tag>scheduled-tasks</tag>
        <command>Powershell.exe -ExecutionPolicy Bypass -Command "Get-ScheduledTask | Where-Object {$_.State -eq 'Ready'} | Select-Object -First 20 TaskName, TaskPath | ConvertTo-Json -Compress"</command>
        <interval>1h</interval>
        <run_on_start>yes</run_on_start>
        <timeout>60</timeout>
      </wodle>
  <wodle name="command">
        <disabled>no</disabled>
        <tag>server-roles-features</tag>
        <command>Powershell.exe -ExecutionPolicy Bypass -Command "Get-WindowsFeature | Where-Object {$_.Installed -eq $true} | Select-Object Name, DisplayName | ConvertTo-Json -Compress"</command>
        <interval>1d</interval>
        <run_on_start>yes</run_on_start>
        <timeout>60</timeout>
      </wodle>
  <wodle name="command">
        <disabled>no</disabled>
        <tag>sysmon-config-update</tag>
        <command>Powershell.exe -ExecutionPolicy Bypass -Command "if (Test-Path 'C:\Program Files (x86)\ossec-agent\shared\sysmonconfig.xml') { if (Test-Path 'C:\Windows\Sysmon64.exe') { C:\Windows\Sysmon64.exe -c 'C:\Program Files (x86)\ossec-agent\shared\sysmonconfig.xml' 2&gt;$null; Write-Host 'Sysmon config updated' } }"</command>
        <interval>1d</interval>
        <run_on_start>yes</run_on_start>
        <timeout>60</timeout>
      </wodle>
  <wodle name="command">
        <disabled>no</disabled>
        <tag>crl-status</tag>
        <command>certutil -CRL</command>
        <interval>1h</interval>
        <run_on_start>yes</run_on_start>
        <timeout>60</timeout>
      </wodle>
  <wodle name="command">
        <disabled>no</disabled>
        <tag>ca-health</tag>
        <command>certutil -ping</command>
        <interval>30m</interval>
        <run_on_start>yes</run_on_start>
        <timeout>30</timeout>
      </wodle>
  <wodle name="command">
        <disabled>no</disabled>
        <tag>sysvol-replication</tag>
        <command>dfsrmig /getglobalstate</command>
        <interval>6h</interval>
        <run_on_start>yes</run_on_start>
        <timeout>60</timeout>
      </wodle>
  <wodle name="command">
        <disabled>no</disabled>
        <tag>dns-zones</tag>
        <command>dnscmd /enumzones</command>
        <interval>1d</interval>
        <run_on_start>yes</run_on_start>
        <timeout>60</timeout>
      </wodle>
  <wodle name="command">
        <disabled>no</disabled>
        <tag>kerberos-tickets</tag>
        <command>klist tickets</command>
        <interval>1h</interval>
        <run_on_start>yes</run_on_start>
        <timeout>60</timeout>
      </wodle>
  <wodle name="command">
        <disabled>no</disabled>
        <tag>fsmo-roles</tag>
        <command>netdom query fsmo</command>
        <interval>1d</interval>
        <run_on_start>yes</run_on_start>
        <timeout>60</timeout>
      </wodle>
  <wodle name="command">
        <disabled>no</disabled>
        <tag>nps-health</tag>
        <command>netsh nps show config</command>
        <interval>1h</interval>
        <run_on_start>yes</run_on_start>
        <timeout>60</timeout>
      </wodle>
  <wodle name="command">
        <disabled>no</disabled>
        <tag>network-connections</tag>
        <command>netstat -an | find "ESTABLISHED" | find /c /v ""</command>
        <interval>5m</interval>
        <run_on_start>yes</run_on_start>
        <timeout>30</timeout>
      </wodle>
  <wodle name="command">
        <disabled>no</disabled>
        <tag>ntds-size</tag>
        <command>powershell.exe -ExecutionPolicy Bypass -Command "(Get-Item 'C:\Windows\NTDS\ntds.dit').Length/1GB"</command>
        <interval>1d</interval>
        <run_on_start>yes</run_on_start>
        <timeout>60</timeout>
      </wodle>
  <wodle name="command">
        <disabled>no</disabled>
        <tag>dhcp-stats</tag>
        <command>powershell.exe -ExecutionPolicy Bypass -Command "Get-DhcpServerv4ScopeStatistics | ConvertTo-Json -Compress"</command>
        <interval>30m</interval>
        <run_on_start>yes</run_on_start>
        <timeout>60</timeout>
      </wodle>
  <wodle name="command">
        <disabled>no</disabled>
        <tag>dc-services</tag>
        <command>powershell.exe -ExecutionPolicy Bypass -Command "Get-Service NTDS,DNS,DHCPServer,IAS,CertSvc,KDC,Netlogon,W32Time,DFSR | Select-Object Name,Status | ConvertTo-Json -Compress"</command>
        <interval>5m</interval>
        <run_on_start>yes</run_on_start>
        <timeout>60</timeout>
      </wodle>
  <wodle name="command">
        <disabled>no</disabled>
        <tag>dc-replication-health</tag>
        <command>powershell.exe -ExecutionPolicy Bypass -Command "repadmin /showrepl /csv | Select-String -Pattern 'fail|error|warning' -CaseSensitive:$false"</command>
        <interval>1h</interval>
        <run_on_start>yes</run_on_start>
        <timeout>90</timeout>
      </wodle>
  <wodle name="command">
        <disabled>no</disabled>
        <tag>time-sync</tag>
        <command>w32tm /query /status</command>
        <interval>1h</interval>
        <run_on_start>yes</run_on_start>
        <timeout>60</timeout>
      </wodle>
</agent_config>
